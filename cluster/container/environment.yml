name: vpr-overlap

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.10.13
  - pytorch=2.3.1
  - torchvision=0.18.1
  - pytorch-cuda=12.1
  - numpy=1.26.4
  - pandas=2.1.3
  - faiss-gpu=1.7.2
  - matplotlib
  - pillow
  - tqdm
  - h5py
  - pyyaml
  - pyproj
  - utm
  - pyparsing
  - termcolor
  - scikit-learn
  - shapely
  - pip
  - pip:
      - pytorch-lightning==2.1.2
      - pytorch-metric-learning==2.3.0
      - torchmetrics==1.2.0
      - opencv-python-headless
      - tensorboard
